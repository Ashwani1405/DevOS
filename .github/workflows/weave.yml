name: weave

on:
  push:
    paths:
      - "weave/**"
      - ".github/workflows/weave.yml"
  pull_request:
    paths:
      - "weave/**"
      - ".github/workflows/weave.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: weave

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: weave

      - name: format
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --lib --bins --tests --all-features

  bench:
    name: benchmarks build and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: weave

      - name: run benchmarks
        run: cargo bench --bench baseline
